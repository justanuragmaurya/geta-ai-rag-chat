[project]
name = "geta-api"
version = "0.1.0"
description = "FastAPI backend for Geta AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.6.1",
  "PyJWT>=2.10.1",
  "passlib[bcrypt]>=1.7.4",
  "openai>=1.54.0",
  "qdrant-client>=1.12.0",
  "slowapi>=0.1.9",
  "python-dotenv>=1.0.1",
  "email-validator>=2.2.0",
  "greenlet>=3.3.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
