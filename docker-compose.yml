version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: geta-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: geta-postgres
    environment:
      POSTGRES_USER: geta
      POSTGRES_PASSWORD: geta_secret
      POSTGRES_DB: getaai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant-storage:
  postgres-data:
